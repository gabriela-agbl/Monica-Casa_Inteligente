services:
  # Servidor da base de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: monica_postgres
    restart: always
    environment:
      POSTGRES_DB: monica_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Executa o script init.sql automaticamente ao criar o container
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Instância da Evolution API para gestão do WhatsApp
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: monica_evolution_api
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - DOCKER_ENV=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=monica_secret_key_2050
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  evolution_instances: