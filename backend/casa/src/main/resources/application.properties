server.port=8080

# ---------------- PostgreSQL (docker-compose.yml) ----------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monica_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}

# ---------------- JPA / Hibernate ----------------
# O schema oficial vem do database/init.sql; o Hibernate apenas complementa (ex.: historico_dispositivos).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------- Evolution API (WhatsApp) ----------------
# false = nao envia nada (util para testar sem WhatsApp conectado)
evolution.enabled=${EVOLUTION_ENABLED:true}
# Porta 8081 do host (docker-compose mapeia 8081 -> 8080 do container)
evolution.base-url=${EVOLUTION_URL:http://localhost:8081}
# Mesmo valor de AUTHENTICATION_API_KEY no docker-compose.yml
evolution.api-key=${EVOLUTION_API_KEY:monica_secret_key_2050}
# Nome da instancia criada via POST /api/admin/whatsapp/instancia
evolution.instance=${EVOLUTION_INSTANCE:monica}
evolution.timeout-seconds=5

# ---------------- Mônica ----------------
# Fuso usado pelo @Scheduled (rotinas "minuto a minuto")
monica.timezone=America/Sao_Paulo
monica.scheduler.enabled=true
# Origens liberadas no CORS (front React/Vite = 5173, CRA = 3000)
monica.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# Cadastro publico (POST /api/auth/register) cria apenas usuarios COMUM
monica.registro-publico=true

# Primeiro ADMIN (criado so se nao existir nenhum). TROQUE a senha e o telefone!
# O telefone e o numero que recebe os alertas no WhatsApp (DDI+DDD+numero).
monica.admin.nome=${MONICA_ADMIN_NOME:Morador Monica}
monica.admin.email=${MONICA_ADMIN_EMAIL:admin@monica.local}
monica.admin.senha=${MONICA_ADMIN_SENHA:admin123}
monica.admin.telefone=${MONICA_ADMIN_TELEFONE:5511999999999}
